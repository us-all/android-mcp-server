name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - name: Install ADB (required for server startup in token-stats)
        if: matrix.node-version == 22
        run: sudo apt-get update && sudo apt-get install -y android-tools-adb
      - name: Token stats (regression guard, Node 22 only)
        if: matrix.node-version == 22
        run: pnpm run token-stats
        env:
          TOKEN_BUDGET: 11000
